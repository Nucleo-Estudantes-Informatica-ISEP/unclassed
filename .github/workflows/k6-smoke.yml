name: k6 Smoke

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Target URL to run the smoke test against (must be staging — test-session is disabled on production)"
        required: true
  # Callable from a post-deploy workflow (e.g. staging deploy — see #173).
  workflow_call:
    inputs:
      target_url:
        description: "Target URL to run the smoke test against"
        type: string
        required: true
    secrets:
      K6_E2E_TEST_SECRET:
        required: true

permissions:
  contents: read

concurrency:
  group: k6-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: k6 smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run smoke test
        run: k6 run tests/k6/scenarios/smoke.js
        env:
          K6_BASE_URL: ${{ inputs.target_url }}
          E2E_TEST_SECRET: ${{ secrets.K6_E2E_TEST_SECRET }}

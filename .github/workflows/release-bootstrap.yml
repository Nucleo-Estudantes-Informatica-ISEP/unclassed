name: Release Bootstrap

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-bootstrap.yml
  workflow_dispatch: {}

jobs:
  bootstrap-v2:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BOOTSTRAP_SHA: d43a4be455be4ce6302a5fa13cf518e766ee3c3b
    steps:
      - name: Create release labels
        run: |
          gh label create release:major --color B60205 --description "Next merge to main creates a new major release" --force
          gh label create release:minor --color 0E8A16 --description "Next merge to main creates a new minor release" --force
          gh label create release:patch --color 1D76DB --description "Next merge to main creates a new patch release" --force

      - name: Publish Unclassed v2 baseline
        run: |
          set -euo pipefail

          if gh release view v2.0.0 >/dev/null 2>&1; then
            echo "v2.0.0 already exists; bootstrap is complete."
            exit 0
          fi

          cat > /tmp/release-notes.md <<EOF
          # Unclassed v2

          Unclassed v2 establishes the production release baseline for the ISEP Informatics class-swap platform.

          ## Highlights

          - Single-subject and full-class swap requests with ordered target preferences.
          - Automated graph matching for direct, three-way and larger exchange cycles.
          - Provisional matches, acceptance/rejection flows and operational matching telemetry.
          - Centralized AuthNEI authentication backed by ZITADEL and local identity linking.
          - Admin monitoring for matching runs, cron execution and partition health.
          - Email match notifications, Docker deployment and application health checks.

          ## Scope

          This release points to the production main snapshot at ${BOOTSTRAP_SHA}. Work currently accumulated on dev is deliberately not included; the next dev-to-main promotion becomes the first automatically versioned release after v2.0.0.

          From this release onward, PRs into main select exactly one semantic-version bump using release:major, release:minor or release:patch.
          EOF

          gh release create v2.0.0 \
            --target "$BOOTSTRAP_SHA" \
            --title "Unclassed v2" \
            --notes-file /tmp/release-notes.md \
            --latest

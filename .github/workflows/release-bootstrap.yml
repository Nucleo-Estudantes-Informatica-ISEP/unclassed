name: Release Bootstrap

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release-bootstrap.yml"
  workflow_dispatch:

jobs:
  bootstrap-v2:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Publish v2 baseline and create release labels
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const bootstrapSha = "d43a4be455be4ce6302a5fa13cf518e766ee3c3b";
            const v2Tag = "v2.0.0";
            const refs = await github.paginate(github.rest.git.listMatchingRefs, { owner, repo, ref: "tags/", per_page: 100 });
            const releaseLabels = [
              { name: "release:major", color: "b60205", description: "Next merge to main creates a new major release" },
              { name: "release:minor", color: "0e8a16", description: "Next merge to main creates a new minor release" },
              { name: "release:patch", color: "1d76db", description: "Next merge to main creates a new patch release" },
            ];
            for (const label of releaseLabels) {
              try { await github.rest.issues.createLabel({ owner, repo, ...label }); }
              catch (error) { if (error.status !== 422) throw error; }
            }
            if (refs.some((ref) => ref.ref === `refs/tags/${v2Tag}`)) {
              core.info(`${v2Tag} already exists; bootstrap is complete.`);
              return;
            }
            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            for (const release of releases) {
              if (release.draft) await github.rest.repos.deleteRelease({ owner, repo, release_id: release.id });
            }
            await github.rest.git.createRef({ owner, repo, ref: `refs/tags/${v2Tag}`, sha: bootstrapSha });
            const body = `# Unclassed v2

Unclassed v2 establishes the production release baseline for the ISEP Informatics class-swap platform.

## Highlights

- Single-subject and full-class swap requests with ordered target preferences.
- Automated graph matching for direct, three-way and larger exchange cycles.
- Provisional matches, acceptance/rejection flows and operational matching telemetry.
- Centralized AuthNEI authentication backed by ZITADEL and local identity linking.
- Admin monitoring for matching runs, cron execution and partition health.
- Email match notifications, Docker deployment and application health checks.

## Scope

This tag points to the production \`main\` snapshot at \`${bootstrapSha}\`. Work currently accumulated on \`dev\` is deliberately not included; the next \`dev → main\` promotion becomes the first automatically versioned release after v2.0.0.

From this release onward, PRs into \`main\` select exactly one semantic-version bump using \`release:major\`, \`release:minor\` or \`release:patch\`.`;
            await github.rest.repos.createRelease({ owner, repo, tag_name: v2Tag, target_commitish: bootstrapSha, name: "Unclassed v2", body, draft: false, prerelease: false, make_latest: "true" });

name: CI

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: mongodb://127.0.0.1:27017/unclassed_ci
  APP_BASE_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  AUTH_SECRET: ci-only-auth-secret-with-at-least-32-characters
  AUTH_ISSUER_URL: https://auth.example.test
  AUTH_CLIENT_ID: ci-client
  AUTH_CLIENT_SECRET: ci-client-secret
  ENABLE_CRON_SCHEDULER: "false"
  CRON_SECRET: ci-only-cron-secret-at-least-32-characters

jobs:
  quality:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.19.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Validate Prisma schema
        run: pnpm schema:validate

      - name: Production build
        run: pnpm build

  docker:
    name: Production Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -t unclassed-check .

      - name: Verify non-root runtime
        run: test "$(docker inspect --format '{{.Config.User}}' unclassed-check)" = "nextjs"

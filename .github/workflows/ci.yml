name: CI

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: mongodb://127.0.0.1:27017/unclassed_ci
  APP_BASE_URL: http://localhost:3000
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  AUTH_SECRET: ci-only-auth-secret-with-at-least-32-characters
  AUTH_ISSUER_URL: https://auth.example.test
  AUTH_CLIENT_ID: ci-client
  AUTH_CLIENT_SECRET: ci-client-secret
  AUTH_POST_LOGOUT_REDIRECT_URI: http://localhost:3000/
  ENABLE_CRON_SCHEDULER: "false"
  CRON_SECRET: ci-only-cron-secret-at-least-32-characters

jobs:
  quality:
    name: Lint, typecheck, test & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.19.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Validate Prisma schema
        run: pnpm schema:validate

      - name: Production build
        run: pnpm build

  docker:
    name: Production Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build runtime image
        run: docker build -t unclassed-check .

      - name: Build schema deployment image
        run: docker build --target schema -t unclassed-schema-check .

      - name: Verify non-root runtime
        run: test "$(docker inspect --format '{{.Config.User}}' unclassed-check)" = "nextjs"

      - name: Verify runtime container starts
        run: |
          docker run --detach --name unclassed-runtime-check \
            --env NODE_ENV=production \
            --env DATABASE_URL=mongodb://127.0.0.1:27017/unclassed_ci \
            --env APP_BASE_URL=http://localhost:3000 \
            --env NEXT_PUBLIC_APP_URL=http://localhost:3000 \
            --env AUTH_SECRET=ci-only-auth-secret-with-at-least-32-characters \
            --env AUTH_ISSUER_URL=https://auth.example.test \
            --env AUTH_CLIENT_ID=ci-client \
            --env AUTH_CLIENT_SECRET=ci-client-secret \
            --env AUTH_POST_LOGOUT_REDIRECT_URI=http://localhost:3000/ \
            --env ENABLE_CRON_SCHEDULER=false \
            --env CRON_SECRET=ci-only-cron-secret-at-least-32-characters \
            unclassed-check

          sleep 5

          if [ "$(docker inspect --format '{{.State.Running}}' unclassed-runtime-check)" != "true" ]; then
            docker logs unclassed-runtime-check
            exit 1
          fi

      - name: Show runtime logs on failure
        if: failure()
        run: docker logs unclassed-runtime-check || true

      - name: Cleanup runtime container
        if: always()
        run: docker rm -f unclassed-runtime-check || true

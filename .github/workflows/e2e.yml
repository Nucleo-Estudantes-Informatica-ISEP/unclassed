name: E2E

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright E2E tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: mongodb://127.0.0.1:27017/unclassed_e2e?replicaSet=rs0&directConnection=true
      APP_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      AUTH_SECRET: ci-only-auth-secret-with-at-least-32-characters # gitleaks:allow
      AUTH_ISSUER_URL: https://auth.example.test
      AUTH_CLIENT_ID: ci-client
      AUTH_CLIENT_SECRET: ci-client-secret
      AUTH_POST_LOGOUT_REDIRECT_URI: http://localhost:3000/
      AUTH_TRUST_HOST: "true"
      ENABLE_CRON_SCHEDULER: "false"
      CRON_SECRET: ci-only-cron-secret-at-least-32-characters # gitleaks:allow
      E2E_TEST_SECRET: ci-only-e2e-secret-at-least-32-characters # gitleaks:allow
      PLAYWRIGHT_BASE_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.19.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Start ephemeral MongoDB replica set
        run: |
          docker run -d --name mongo-e2e \
            -p 27017:27017 \
            mongo:7 --replSet rs0 --bind_ip_all

          echo "Waiting for MongoDB to accept connections..."
          until docker exec mongo-e2e mongosh --quiet --eval "db.runCommand({ ping: 1 }).ok" 2>/dev/null | grep -q "1"; do
            sleep 1
          done

          echo "Initiating replica set rs0..."
          docker exec mongo-e2e mongosh --quiet --eval "rs.initiate({ _id: 'rs0', members: [{ _id: 0, host: '127.0.0.1:27017' }] })"

          echo "Waiting for replica set primary..."
          until docker exec mongo-e2e mongosh --quiet --eval "db.hello().isWritablePrimary" 2>/dev/null | grep -q "true"; do
            sleep 1
          done
          echo "MongoDB replica set rs0 is ready."

      - name: Deploy Prisma schema
        run: pnpm schema:deploy

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Start application server
        run: nohup pnpm dev > /tmp/nextjs.log 2>&1 &

      - name: Wait for application to be ready
        run: |
          timeout 120 bash -c 'until curl -sf http://localhost:3000/api/health; do sleep 2; done'

      - name: Run E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Show application logs on failure
        if: failure()
        run: cat /tmp/nextjs.log || true

      - name: Cleanup MongoDB
        if: always()
        run: docker rm -f mongo-e2e || true

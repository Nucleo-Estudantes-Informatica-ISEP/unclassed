services:
  app:
    build: .
    environment:
      - NODE_ENV=${NODE_ENV}
      - DATABASE_URL=${DATABASE_URL}
      - APP_BASE_URL=${APP_BASE_URL}
      - AUTH_SECRET=${AUTH_SECRET}
      - AUTH_ISSUER_URL=${AUTH_ISSUER_URL}
      - AUTH_CLIENT_ID=${AUTH_CLIENT_ID}
      - AUTH_CLIENT_SECRET=${AUTH_CLIENT_SECRET}
      - AUTH_SCOPES=${AUTH_SCOPES}
      - AUTH_POST_LOGOUT_REDIRECT_URI=${AUTH_POST_LOGOUT_REDIRECT_URI}
      - AUTH_TRUST_HOST=${AUTH_TRUST_HOST}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}
      - ENABLE_CRON_SCHEDULER=${ENABLE_CRON_SCHEDULER}
      - CRON_BATCH_MATCHING=${CRON_BATCH_MATCHING}
      - CRON_PROVISIONAL_CLEANUP=${CRON_PROVISIONAL_CLEANUP}
      - CRON_HEALTH_CHECK=${CRON_HEALTH_CHECK}
      - CRON_SECRET=${CRON_SECRET}
      - EMAIL_FROM=${EMAIL_FROM}
      - EMAIL_HOST=${EMAIL_HOST}
      - EMAIL_PORT=${EMAIL_PORT}
      - EMAIL_SECURE=${EMAIL_SECURE}
      - EMAIL_USER=${EMAIL_USER}
      - EMAIL_PASS=${EMAIL_PASS}
      - ADMIN_CACHE_TTL=${ADMIN_CACHE_TTL}
      - NEXT_TELEMETRY_DISABLED=${NEXT_TELEMETRY_DISABLED}
    restart: unless-stopped

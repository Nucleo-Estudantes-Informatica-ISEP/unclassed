version: '3.8'

services:
  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3
    restart: unless-stopped
    networks:
      - unclassed-network

  # Application Instance 1
  app1:
    build: .
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - ENABLE_CRON_SCHEDULER=true
      - INSTANCE_ID=app1
      # Cron settings (optional tuning)
      - CRON_BATCH_MATCHING=*/5 * * * *
      - CRON_PROVISIONAL_CLEANUP=*/30 * * * *
    restart: unless-stopped
    networks:
      - unclassed-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Application Instance 2  
  app2:
    build: .
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - ENABLE_CRON_SCHEDULER=true
      - INSTANCE_ID=app2
      # Cron settings (optional tuning)
      - CRON_BATCH_MATCHING=*/5 * * * *
      - CRON_PROVISIONAL_CLEANUP=*/30 * * * *
    restart: unless-stopped
    networks:
      - unclassed-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Application Instance 3
  app3:
    build: .
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - ENABLE_CRON_SCHEDULER=true
      - INSTANCE_ID=app3
      # Cron settings (optional tuning)
      - CRON_BATCH_MATCHING=*/5 * * * *
      - CRON_PROVISIONAL_CLEANUP=*/30 * * * *
    restart: unless-stopped
    networks:
      - unclassed-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  unclassed-network:
    driver: bridge


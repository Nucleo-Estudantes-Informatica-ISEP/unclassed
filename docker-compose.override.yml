version: '3.8'
services:
  nginx:
    depends_on:
      - app1
      - app2
      - app3
  app1:
    build: .
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - APP_BASE_URL=${APP_BASE_URL:?APP_BASE_URL is required}
      - AUTH_SECRET=${AUTH_SECRET:?AUTH_SECRET is required}
      - AUTH_ISSUER_URL=${AUTH_ISSUER_URL:?AUTH_ISSUER_URL is required}
      - AUTH_CLIENT_ID=${AUTH_CLIENT_ID:?AUTH_CLIENT_ID is required}
      - AUTH_CLIENT_SECRET=${AUTH_CLIENT_SECRET:?AUTH_CLIENT_SECRET is required}
      - AUTH_SCOPES=${AUTH_SCOPES:-openid email profile offline_access}
      - AUTH_ROLE_CLAIM=${AUTH_ROLE_CLAIM:-urn:zitadel:iam:org:project:roles}
      - AUTH_POST_LOGOUT_REDIRECT_URI=${AUTH_POST_LOGOUT_REDIRECT_URI:?AUTH_POST_LOGOUT_REDIRECT_URI is required}
      - AUTH_TRUST_HOST=${AUTH_TRUST_HOST:-false}
      - CRON_SECRET=${CRON_SECRET:?CRON_SECRET is required}
      - ENABLE_CRON_SCHEDULER=true
      - INSTANCE_ID=app1
      - CRON_BATCH_MATCHING=${CRON_BATCH_MATCHING:-*/5 * * * *}
      - CRON_PROVISIONAL_CLEANUP=${CRON_PROVISIONAL_CLEANUP:-*/30 * * * *}
    restart: unless-stopped
    networks:
      - unclassed-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
  app2:
    build: .
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - APP_BASE_URL=${APP_BASE_URL:?APP_BASE_URL is required}
      - AUTH_SECRET=${AUTH_SECRET:?AUTH_SECRET is required}
      - AUTH_ISSUER_URL=${AUTH_ISSUER_URL:?AUTH_ISSUER_URL is required}
      - AUTH_CLIENT_ID=${AUTH_CLIENT_ID:?AUTH_CLIENT_ID is required}
      - AUTH_CLIENT_SECRET=${AUTH_CLIENT_SECRET:?AUTH_CLIENT_SECRET is required}
      - AUTH_SCOPES=${AUTH_SCOPES:-openid email profile offline_access}
      - AUTH_ROLE_CLAIM=${AUTH_ROLE_CLAIM:-urn:zitadel:iam:org:project:roles}
      - AUTH_POST_LOGOUT_REDIRECT_URI=${AUTH_POST_LOGOUT_REDIRECT_URI:?AUTH_POST_LOGOUT_REDIRECT_URI is required}
      - AUTH_TRUST_HOST=${AUTH_TRUST_HOST:-false}
      - CRON_SECRET=${CRON_SECRET:?CRON_SECRET is required}
      - ENABLE_CRON_SCHEDULER=false
      - INSTANCE_ID=app2
      - CRON_BATCH_MATCHING=${CRON_BATCH_MATCHING:-*/5 * * * *}
      - CRON_PROVISIONAL_CLEANUP=${CRON_PROVISIONAL_CLEANUP:-*/30 * * * *}
    restart: unless-stopped
    networks:
      - unclassed-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
  app3:
    build: .
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - APP_BASE_URL=${APP_BASE_URL:?APP_BASE_URL is required}
      - AUTH_SECRET=${AUTH_SECRET:?AUTH_SECRET is required}
      - AUTH_ISSUER_URL=${AUTH_ISSUER_URL:?AUTH_ISSUER_URL is required}
      - AUTH_CLIENT_ID=${AUTH_CLIENT_ID:?AUTH_CLIENT_ID is required}
      - AUTH_CLIENT_SECRET=${AUTH_CLIENT_SECRET:?AUTH_CLIENT_SECRET is required}
      - AUTH_SCOPES=${AUTH_SCOPES:-openid email profile offline_access}
      - AUTH_ROLE_CLAIM=${AUTH_ROLE_CLAIM:-urn:zitadel:iam:org:project:roles}
      - AUTH_POST_LOGOUT_REDIRECT_URI=${AUTH_POST_LOGOUT_REDIRECT_URI:?AUTH_POST_LOGOUT_REDIRECT_URI is required}
      - AUTH_TRUST_HOST=${AUTH_TRUST_HOST:-false}
      - CRON_SECRET=${CRON_SECRET:?CRON_SECRET is required}
      - ENABLE_CRON_SCHEDULER=false
      - INSTANCE_ID=app3
      - CRON_BATCH_MATCHING=${CRON_BATCH_MATCHING:-*/5 * * * *}
      - CRON_PROVISIONAL_CLEANUP=${CRON_PROVISIONAL_CLEANUP:-*/30 * * * *}
    restart: unless-stopped
    networks:
      - unclassed-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
